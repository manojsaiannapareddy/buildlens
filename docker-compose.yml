services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: buildlens-postgres
    environment:
      POSTGRES_USER: buildlens
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: buildlens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildlens -d buildlens"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
    container_name: buildlens-api
    environment:
      BUILDLENS_ENVIRONMENT: dev
      BUILDLENS_LOG_LEVEL: INFO
      BUILDLENS_DATABASE_URL: postgresql+asyncpg://buildlens:localdev@postgres:5432/buildlens
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: buildlens-worker
    command: ["python", "-m", "buildlens.main_worker"]
    environment:
      BUILDLENS_ENVIRONMENT: dev
      BUILDLENS_LOG_LEVEL: INFO
      BUILDLENS_DATABASE_URL: postgresql+asyncpg://buildlens:localdev@postgres:5432/buildlens
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
