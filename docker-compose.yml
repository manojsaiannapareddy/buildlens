services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: buildlens-postgres
    environment:
      POSTGRES_USER: buildlens
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: buildlens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildlens -d buildlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
