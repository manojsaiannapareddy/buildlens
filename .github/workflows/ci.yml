name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    env:
         BUILDLENS_DATABASE_URL: postgresql+asyncpg://buildlens:localdev@localhost:5432/buildlens
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from lock file
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Check for model/migration drift
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest -v
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: buildlens
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: buildlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
